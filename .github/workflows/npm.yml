name: npm packages
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]   # Publish: GitHub > Releases > "Draft a new release" with tag vX.Y.Z
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take Filee CLI from the official release (SHA-256 pinned, no build)
        run: node npm/scripts/prepare-filee.mjs all
      - name: Pack
        run: |
          mkdir packs
          for p in filee-win32-x64 filee-linux-x64 hwpx-bridge; do (cd npm/$p && npm pack --pack-destination ../../packs); done
          ls -la packs
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: packs/*.tgz
          retention-days: 7

  test:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: packs
      - name: Install packed packages into an empty folder
        shell: bash
        run: |
          mkdir e2e && cd e2e && npm init -y > /dev/null
          platform=$([ "$RUNNER_OS" = "Windows" ] && echo win32-x64 || echo linux-x64)
          npm i ../packs/hwpx-bridge-filee-$platform-*.tgz ../packs/hwpx-bridge-0*.tgz
          cp -r ../npm/test .
      - name: doctor
        working-directory: e2e
        run: npx hwpx-bridge doctor
      - name: End-to-end MCP test
        working-directory: e2e
        run: node test/e2e.mjs
      - name: setup registers every installed app (throw-away home folder)
        working-directory: e2e
        run: node test/setup-test.mjs
      - name: Windows one-line installer (irm | iex path, Node already present)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:HWPX_BRIDGE_PACKAGE = (Resolve-Path (Get-ChildItem packs\hwpx-bridge-0*.tgz)).Path
          $env:HWPX_BRIDGE_CLIENTS = 'cursor'
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $config = Get-Content -Raw (Join-Path $env:USERPROFILE '.cursor\mcp.json') | ConvertFrom-Json
          $entry = $config.mcpServers.'hwpx-bridge'
          if ($entry.command -ne 'cmd' -or ($entry.args -join ' ') -notmatch 'hwpx-bridge@\d+\.\d+\.\d+ mcp') { throw "unexpected entry: $($entry | ConvertTo-Json -Compress)" }
          Write-Host "Cursor entry: $($entry | ConvertTo-Json -Compress)"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: packs
      - name: Publish (platform packages first, then hwpx-bridge)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "NPM_TOKEN secret is not set"; exit 1; }
          for tgz in packs/hwpx-bridge-filee-win32-x64-*.tgz packs/hwpx-bridge-filee-linux-x64-*.tgz packs/hwpx-bridge-0*.tgz; do
            name=$(tar -xOzf "$tgz" package/package.json | node -pe 'JSON.parse(require("fs").readFileSync(0)).name')
            version=$(tar -xOzf "$tgz" package/package.json | node -pe 'JSON.parse(require("fs").readFileSync(0)).version')
            [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match $name $version"; exit 1; }
            # Re-running a release must not try to publish a version twice.
            if npm view "$name@$version" version > /dev/null 2>&1; then echo "$name@$version already on npm"; continue; fi
            npm publish --access public "./$tgz"   # "./" so npm reads a file, not a GitHub "owner/repo"
          done
